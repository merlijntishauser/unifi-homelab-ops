version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint refuses to load against TypeScript 7.0 -- it throws
      # "typescript-eslint does not support TS 7.0" and `npm ci` fails outright
      # on the peer range (>=4.8.4 <6.1.0). tsc itself is fine; only linting
      # breaks. Upstream is targeting TS >=7.1, not 7.0:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      #
      # Lift this once typescript-eslint ships TS 7 support: deleting the entry
      # is enough. The narrower `[>= 7.a, < 8]` condition that PR #62's
      # `@dependabot ignore` comment stored has been cleared with
      # `@dependabot unignore typescript`, so this rule is the only one left --
      # confirmed with `@dependabot show typescript ignore conditions`, which
      # is worth re-running before assuming the same next time.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
